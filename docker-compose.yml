# 三容器：db（PostgreSQL 16 + pgvector）· api（FastAPI）· web（Vue 3 工作台，nginx 托管 + /api 反代）
#
# 环境变量从仓库根目录的 .env 自动读取（compose 内置行为）；缺省值仅用于本地开发。
# 生产部署必须显式设置：APP_ENV=production、强随机 JWT_SECRET（≥32 字符）、
# 非默认 ADMIN_INIT_PASS（≥12 字符），并删除下面的默认值。
#
# ⚠️ 容器内【不含 LLM 引擎】：知识层的编译/审核/问答由宿主机的 Claude Code 经
#    vault/ 触发文件消费，容器只做 API / 工作台 / 数据层。详见 README「LLM 引擎」节。
services:
  db:
    image: pgvector/pgvector:pg16
    environment:
      POSTGRES_DB: llmwiki
      POSTGRES_USER: llmwiki
      POSTGRES_PASSWORD: llmwiki
    ports:
      - "127.0.0.1:5432:5432" # 仅本机开发/测试直连，避免数据库暴露公网
    volumes:
      - pgdata:/var/lib/postgresql/data
      # 每次启动创建/修复测试库 llmwiki_test（幂等），使 pytest 可在容器内运行
      - ./docker/initdb/10-test-db:/docker-entrypoint-initdb.d/10-test-db:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U llmwiki -d llmwiki"]
      interval: 5s
      timeout: 3s
      retries: 10

  api:
    build: .
    command: ["uvicorn", "api.main:app", "--host", "0.0.0.0", "--port", "8000"]
    ports:
      - "127.0.0.1:8000:8000" # 生产应由反向代理对外提供 HTTPS
    volumes:
      - ./vault:/app/vault    # 共享 vault 卷（与 streamlit 同一挂载，路径一致）
    depends_on:
      db:
        condition: service_healthy
    environment:
      - KB_ROOT=/app/vault
      - DB_HOST=db
      - DB_PORT=5432
      - DB_NAME=llmwiki
      - DB_USER=llmwiki
      - DB_PASS=llmwiki
      - APP_ENV=${APP_ENV:-development}
      - JWT_SECRET=${JWT_SECRET:-dev-secret-change-me-please-32bytes}
      - ADMIN_INIT_USER=${ADMIN_INIT_USER:-admin}
      - ADMIN_INIT_PASS=${ADMIN_INIT_PASS:-admin123}
      # SP4 混合检索：未配置时 /search 自动降级 grep-only（向量通道失效）
      - DASHSCOPE_API_KEY=${DASHSCOPE_API_KEY:-}
      # 敏感数值受控加密器（SA-01）：未配置时含金额的纪要会被门禁拒绝
      - SENSITIVE_FIELD_KEY=${SENSITIVE_FIELD_KEY:-}
      # 模型调用（销售澄清 Agent）
      - MODEL_BASE_URL=${MODEL_BASE_URL:-https://dashscope.aliyuncs.com/compatible-mode/v1}
      - MODEL_API_KEY=${MODEL_API_KEY:-}
      - MODEL_NAME=${MODEL_NAME:-qwen-plus}
      # SP2.5 可观测性探针（可选；未配置时 tools/langfuse_probe.py 零侵入跳过）
      - LANGFUSE_PUBLIC_KEY=${LANGFUSE_PUBLIC_KEY:-}
      - LANGFUSE_SECRET_KEY=${LANGFUSE_SECRET_KEY:-}
      - LANGFUSE_HOST=${LANGFUSE_HOST:-}
    healthcheck:
      test: ["CMD-SHELL", "python -c \"import urllib.request;urllib.request.urlopen('http://localhost:8000/healthz')\""]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped

  web:
    build:
      context: .
      dockerfile: Dockerfile.web
      args:
        # 国内构建可覆盖：--build-arg NPM_REGISTRY=https://registry.npmmirror.com
        NPM_REGISTRY: ${NPM_REGISTRY:-https://registry.npmjs.org/}
    ports:
      - "127.0.0.1:8501:80"   # 原 Streamlit 端口，前端工作台（nginx 托管 + /api 反代）
    depends_on:
      api:
        condition: service_healthy
    restart: unless-stopped

volumes:
  pgdata:
