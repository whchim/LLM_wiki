services:
  db:
    image: pgvector/pgvector:pg16
    environment:
      POSTGRES_DB: llmwiki
      POSTGRES_USER: llmwiki
      POSTGRES_PASSWORD: llmwiki
    ports:
      - "127.0.0.1:5432:5432" # 仅本机开发/测试直连，避免数据库暴露公网
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U llmwiki -d llmwiki"]
      interval: 5s
      timeout: 3s
      retries: 10

  api:
    build: .
    command: ["uvicorn", "api.main:app", "--host", "0.0.0.0", "--port", "8000"]
    ports:
      - "127.0.0.1:8000:8000" # 生产应由反向代理对外提供 HTTPS
    volumes:
      - ./vault:/app/vault    # 共享 vault 卷（与 streamlit 同一挂载，路径一致）
    depends_on:
      db:
        condition: service_healthy
    environment:
      - KB_ROOT=/app/vault
      - DB_HOST=db
      - DB_PORT=5432
      - DB_NAME=llmwiki
      - DB_USER=llmwiki
      - DB_PASS=llmwiki
      - APP_ENV=${APP_ENV:-development}
      - JWT_SECRET=${JWT_SECRET:-dev-secret-change-me-please-32bytes}
      - ADMIN_INIT_USER=${ADMIN_INIT_USER:-admin}
      - ADMIN_INIT_PASS=${ADMIN_INIT_PASS:-admin123}
    healthcheck:
      test: ["CMD-SHELL", "python -c \"import urllib.request;urllib.request.urlopen('http://localhost:8000/healthz')\""]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped

  streamlit:
    build: .
    ports:
      - "127.0.0.1:8501:8501"
    volumes:
      - ./vault:/app/vault    # Obsidian Vault（知识 Markdown 与 _triggers/）
    depends_on:
      db:
        condition: service_healthy
      api:
        condition: service_healthy
    environment:
      - KB_ROOT=/app/vault
      - DB_HOST=db
      - DB_PORT=5432
      - DB_NAME=llmwiki
      - DB_USER=llmwiki
      - DB_PASS=llmwiki
      - API_BASE=http://api:8000
      - APP_ENV=${APP_ENV:-development}
      - JWT_SECRET=${JWT_SECRET:-dev-secret-change-me-please-32bytes}
    restart: unless-stopped

volumes:
  pgdata:
